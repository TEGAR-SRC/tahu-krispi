# Kilat Cloud Backend — Docker deployment
# Builds the API image from backend/Dockerfile and runs it with PostgreSQL
# and Redis side-by-side. The API auto-migrates on startup.
#
# Usage:
#   docker compose --env-file compose.env up -d --build
#
# Data is persisted on the local filesystem (bind mounts under ./data/),
# so containers can be recreated without losing the database.
#
# Every variable below has a safe, valid default. Secrets marked "required"
# (JWT_SECRET, SECRET_ENCRYPTION_KEY) must be provided via compose.env — set
# them there (see compose.env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: kilat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kilat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kilat}
      POSTGRES_DB: ${POSTGRES_DB:-kilat_cloud}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      # Local filesystem persistence (bind mount), not a docker named volume.
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/initdb-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kilat} -d ${POSTGRES_DB:-kilat_cloud}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kilat-net

  redis:
    image: redis:7-alpine
    container_name: kilat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-54389}:6379"
    volumes:
      # Local filesystem persistence (bind mount).
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kilat-net

  # RustFS — S3-compatible object storage (replaces MinIO). Single-node
  # single-disk; data persisted on the local filesystem (bind mount).
  rustfs_perms:
    image: alpine:3.20
    container_name: kilat-rustfs-perms
    user: root
    volumes:
      - ./data/rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kilat-rustfs
    restart: unless-stopped
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-kilat}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-kilat-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    ports:
      - "${RUSTFS_PORT:-54390}:9000"
      - "${RUSTFS_CONSOLE_PORT:-54391}:9001"
    volumes:
      - ./data/rustfs:/data
      - ./data/rustfs-logs:/var/log/rustfs/
    networks:
      - kilat-net

  # Create the asset buckets RustFS serves once (mirrors app.object_storage_backends).
  rustfs-init:
    image: rustfs/rustfs:latest
    container_name: kilat-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      for b in kilat-avatars kilat-documents kilat-isos kilat-tickets kilat-invoices kilat-cloud-dev; do
        echo \"skip bucket creation (RustFS creates buckets via S3 PutBucket on demand)\" ;
      done"
    networks:
      - kilat-net

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kilat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      APP_DOMAIN: ${APP_DOMAIN:-kilat-cloud.com}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.kilat-cloud.com}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-https://console.kilat-cloud.com}
      ADMIN_CONSOLE_BASE_URL: ${ADMIN_CONSOLE_BASE_URL:-https://admin.kilat-cloud.com}
      DOWNLOAD_BASE_URL: ${DOWNLOAD_BASE_URL:-https://dl.kilat-cloud.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-kilat}:${POSTGRES_PASSWORD:-kilat}@postgres:5432/${POSTGRES_DB:-kilat_cloud}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in compose.env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in compose.env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sumopod}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in compose.env}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-change-me}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://api-pay.sumopod.com}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-whsec_change_me}
      SUMOPOD_WEBHOOK_TOKEN: ${SUMOPOD_WEBHOOK_TOKEN:-whtok_change_me}
      ADMIN_API_DOMAIN: ${ADMIN_API_DOMAIN:-https://api-admin.kilat-cloud.com}
      USER_API_DOMAIN: ${USER_API_DOMAIN:-https://api-user.kilat-cloud.com}
      LANDING_API_DOMAIN: ${LANDING_API_DOMAIN:-https://api-landing.kilat-cloud.com}
      DOCS_API_DOMAIN: ${DOCS_API_DOMAIN:-https://api-docs.kilat-cloud.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://admin.kilat-cloud.com,https://console.kilat-cloud.com,https://kilat-cloud.com,https://landing.kilat-cloud.com,https://docs.kilat-cloud.com}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL:-false}
      OTP_DEBUG_ECHO: ${OTP_DEBUG_ECHO:-false}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-3}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-20}
      ARGON2_MEMORY: ${ARGON2_MEMORY:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      ARGON2_KEY_LENGTH: ${ARGON2_KEY_LENGTH:-32}
      ARGON2_SALT_LENGTH: ${ARGON2_SALT_LENGTH:-16}
      # Object storage via RustFS (S3-compatible, in this compose network).
      R2_ENDPOINT: ${R2_ENDPOINT:-http://rustfs:9000}
      R2_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-kilat}
      R2_SECRET_KEY: ${RUSTFS_SECRET_KEY:-kilat-secret}
      R2_BUCKET: ${R2_BUCKET:-kilat-cloud-dev}
      # SMTP. Leave SMTP_HOST empty to park email jobs (flows keep working).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@kilat-cloud.com}
    ports:
      - "${API_PORT:-8080}:8080"
    command: ["api"]
    networks:
      - kilat-net

  # Cloudflare Tunnel — online-kan backend tanpa membuka port publik ke
  # internet. cloudflared menjembatani Cloudflare -> network docker, jadi
  # service postgres/redis/rustfs/api cukup reachable di network internal.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kilat-cloudflared
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in compose.env}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in compose.env}
    networks:
      - kilat-net

  # One-off migration runner (auto-migrate already runs on api startup, but
  # this is available for manual `docker compose run --rm migrate`).
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kilat-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kilat}:${POSTGRES_PASSWORD:-kilat}@postgres:5432/${POSTGRES_DB:-kilat_cloud}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-placeholder}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-placeholder}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-placeholder}
    command: ["migrate"]
    profiles: ["migrate"]
    networks:
      - kilat-net

networks:
  kilat-net:
    driver: bridge
