# Kilat Cloud Backend - development environment
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: kilat-postgres
    environment:
      POSTGRES_USER: kilat
      POSTGRES_PASSWORD: kilat
      POSTGRES_DB: kilat_cloud
    ports:
      - "54329:5432"
    volumes:
      - kilat_pgdata:/var/lib/postgresql/data
      # Enable required extensions on first boot (schema also creates them).
      - ./scripts/initdb-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilat -d kilat_cloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kilat-redis
    ports:
      - "54389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for internal uploads (ISO files, ticket attachments,
  # avatars/documents). Point R2_ENDPOINT at http://localhost:54390 for local dev.
  minio:
    image: minio/minio:latest
    container_name: kilat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kilat
      MINIO_ROOT_PASSWORD: kilat-secret
    ports:
      - "54390:9000"
      - "54391:9001"
    volumes:
      - kilat_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates one dedicated bucket per asset category on first boot
  # (mirrors app.object_storage_backends seeded rows).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kilat kilat-secret &&
      for b in kilat-avatars kilat-documents kilat-isos kilat-tickets kilat-invoices kilat-cloud-dev; do
        mc mb --ignore-existing local/$$b;
      done"

volumes:
  kilat_pgdata:
  kilat_minio:
