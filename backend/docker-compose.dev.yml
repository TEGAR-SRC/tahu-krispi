# Kilat Cloud Backend - development environment
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: kilat-postgres
    environment:
      POSTGRES_USER: kilat
      POSTGRES_PASSWORD: kilat
      POSTGRES_DB: kilat_cloud
    ports:
      - "54329:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Enable required extensions on first boot (schema also creates them).
      - ./scripts/initdb-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilat -d kilat_cloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kilat-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "54389:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage via RustFS for internal uploads (ISO files, ticket
  # attachments, avatars/documents). Point R2_ENDPOINT at http://localhost:54390
  # for local dev. Data persisted on the local filesystem (bind mount).
  rustfs_perms:
    image: alpine:3.20
    container_name: kilat-rustfs-perms
    user: root
    volumes:
      - ./data/rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kilat-rustfs
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: kilat
      RUSTFS_SECRET_KEY: kilat-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    ports:
      - "54390:9000"
      - "54391:9001"
    volumes:
      - ./data/rustfs:/data
      - ./data/rustfs-logs:/var/log/rustfs/
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
