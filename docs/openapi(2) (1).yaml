  /vm/{vm_id}/detach-measured-boot:
    post:
      tags:
        - Virtual Machine
      summary: Detach the measured boot image
      description: Clear the VM's measured boot image and power-cycle to apply.
      operationId: detachMeasuredBoot
      security:
        - api_key: []
      parameters:
        - name: vm_id
          in: path
          description: VM UUID
          required: true
          explode: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  description: Team ID. Default team will be used if not provided.
                  type: string
                  format: uuid
                  example: 96616865-475e-4191-aba5-f89f0a4b71fe
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_log_id:
                    type: string
                    format: uuid
                    example: 0f9c2d1a-3b4e-4c5d-8a6f-7b8c9d0e1f2a
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /vm/{vm_id}/rdns:
    get:
      tags:
        - Virtual Machine
      summary: List reverse DNS (PTR) records
      description: List the reverse DNS records configured for the VM's IP addresses.
      operationId: getReverseDNS
      security:
        - api_key: []
      parameters:
        - name: vm_id
          in: path
          description: VM UUID
          required: true
          explode: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  rdns:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                          example: 203.0.113.5
                        domain:
                          type: string
                          example: host.example.com
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
        - Virtual Machine
      summary: Set a reverse DNS (PTR) record
      description: |-
        Set the reverse DNS record for one of the VM's IP addresses. The domain
        must already resolve (A/AAAA) to the IP being configured.
      operationId: setReverseDNS
      security:
        - api_key: []
      parameters:
        - name: vm_id
          in: path
          description: VM UUID
          required: true
          explode: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ip_addr
                - domain
              properties:
                team_id:
                  description: Team ID. Default team will be used if not provided.
                  type: string
                  format: uuid
                  example: 96616865-475e-4191-aba5-f89f0a4b71fe
                ip_addr:
                  description: The VM IP address (IPv4 or IPv6) to set the PTR record for.
                  type: string
                  example: 203.0.113.5
                domain:
                  description: The domain the PTR record should point to.
                  type: string
                  example: host.example.com
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request (invalid IP or domain failed to resolve)
        '401':
          description: Unauthorized (IP not owned by this VM)
        '403':
          description: Forbidden (resolved IP does not match)
        '422':
          description: Unprocessable entity (rDNS provider rejected the record)
  /vm/{vm_id}/rdns/{ip_addr}:
    delete:
      tags:
        - Virtual Machine
      summary: Delete a reverse DNS (PTR) record
      description: Delete the reverse DNS record for one of the VM's IP addresses.
      operationId: deleteReverseDNS
      security:
        - api_key: []
      parameters:
        - name: vm_id
          in: path
          description: VM UUID
          required: true
          explode: true
          schema:
            type: string
            format: uuid
        - name: ip_addr
          in: path
          description: The VM IP address (IPv4 or IPv6) whose PTR record to delete.
          required: true
          explode: true
          schema:
            type: string
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          explode: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Bad request (invalid IP)
        '401':
          description: Unauthorized (IP not owned by this VM)
        '422':
          description: Unprocessable entity (rDNS provider rejected the deletion)
