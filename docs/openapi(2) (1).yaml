components:
  schemas:
    ObjectStorageService:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        region:
          type: string
        endpoint:
          type: string
        capacity:
          type: integer
          description: Storage capacity in KB
        used_capacity:
          type: integer
          description: Used capacity in KB
        status:
          type: string
          enum:
            - active
            - suspended
        created_at:
          type: string
          format: date-time
        renewal_date:
          type: string
          format: date-time
    ObjectStorageServiceDetail:
      allOf:
        - $ref: '#/components/schemas/ObjectStorageService'
        - type: object
          properties:
            recurring_amount:
              type: number
            #            price_per_gb:
            #              type: number
            #            auto_scale_enabled:
            #              type: boolean
            #            auto_scale_limit:
            #              type: integer
            download_usage:
              type: integer
              description: Download usage in bytes
            upload_usage:
              type: integer
              description: Upload usage in bytes
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c1d45377-b2a9-4407-ab8d-6909c34dfaac
        name:
          type: string
          format: string
          example: IT Development
        role:
          type: string
          enum:
            - Team Owner
            - Team Admin
            - Team Member
            - Team Biller
    VMPrice:
      type: object
      properties:
        instance_type:
          type: string
          format: uuid
          example: a2e55f7d-c741-4317-acce-124dc34ffaad
        vcpu:
          type: integer
          format: int
          example: 2
        ram:
          type: integer
          format: int
          example: 4096
        disk:
          type: integer
          format: int
          example: 20
        bw:
          type: integer
          format: int
        net_rate:
          type: integer
          format: int
        price_per_month:
          type: number
          format: float
        price_per_quarter:
          type: number
          format: float
        price_per_semiannual:
          type: number
          format: float
        price_per_annual:
          type: number
          format: float
        currency:
          type: string
          format: string
    Teams:
      type: array
      items:
        $ref: '#/components/schemas/Team'
    SSHKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a3f2e5d8-1234-4abc-9876-543210fedcba
        created:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        name:
          type: string
          example: "Production Server Key"
        ssh_key:
          type: string
          example: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... user@hostname"
      required:
        - id
        - created
        - name
        - ssh_key
    SSHKeys:
      type: object
      properties:
        ssh_keys:
          type: array
          items:
