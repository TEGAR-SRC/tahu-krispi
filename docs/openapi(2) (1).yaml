  /network/reserved_ips:
    get:
      summary: List reserved IPs
      description: Get all reserved IPs for the authenticated user's team or specified team
      tags:
        - Reserved IPs
      security:
        - api_key: []
      parameters:
        - name: team_id
          in: query
          description: Team ID to fetch reserved IPs for. If not provided, uses the user's primary team
          required: false
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Filter reserved IPs by location name (case-insensitive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of reserved IPs
          content:
            application/json:
              schema:
                type: object
                properties:
                  reserved_ips:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservedIP'
        '401':
          description: Unauthorized - user doesn't have read permission for the team
    post:
      summary: Create a new reserved IP
      description: Allocate a new reserved IP address in the specified location
      tags:
        - Reserved IPs
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: string
                  description: Team ID to create the reserved IP for. If not provided, uses the user's primary team
                ip_type:
                  type: string
                  enum:
                    - ipv4
                    - ipv6
                  description: IPv4 (/32) or IPv6 (/64) address
                location:
                  type: string
                  description: Location name where the IP should be allocated
                name:
                  type: string
                  maxLength: 64
                  description: Custom name for the reserved IP (defaults to IP address if not provided)
              required:
                - location
      responses:
        '200':
          description: Reserved IP successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  rip_id:
                    type: string
                    format: uuid
                    description: ID of the newly created reserved IP
                  ip_addr:
                    type: string
                    description: Newly created reserved IP address
                required:
                  - rip_id
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum:
                      - UNSUPPORTED_LOCATION
                      - IP_NAME_TOO_LONG
                      - NOT_SUPPORTED
                    description: Error code indicating the specific validation failure
        '401':
          description: Unauthorized - user doesn't have write permission for the team
        '402':
          description: Payment required - insufficient balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [INSUFFICIENT_BALANCE]
        '403':
          description: Forbidden - quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [RESERVED_IP_QUOTA_EXCEEDED]
        '404':
          description: Resource not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [RESOURCE_NOT_AVAILABLE]
                    description: No available IP addresses in the specified location
  /network/reserved_ips/convert:
    post:
      summary: Convert VM's primary IP to reserved IP
      description: Convert an existing VM's primary public IP address into a reserved IP (floating IP)
      tags:
        - Reserved IPs
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: string
                  description: Team ID that owns the VM. If not provided, uses the user's primary team
                ip_address:
                  type: string
                  format: ipv4
                  description: The VM's primary public IP address to convert
                name:
                  type: string
                  maxLength: 64
                  description: Custom name for the reserved IP (defaults to IP address if not provided)
              required:
                - ip_address
      responses:
        '200':
          description: IP successfully converted to reserved IP
          content:
            application/json:
              schema:
                type: object
                properties:
                  reserved_ip:
                    $ref: '#/components/schemas/ReservedIP'
                required:
                  - reserved_ip
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum:
                      - IP_NAME_TOO_LONG
                      - UNSUPPORTED_LOCATION
                    description: Error code indicating validation failure
        '401':
          description: Unauthorized - user doesn't have write permission for the team
        '402':
          description: Payment required - insufficient balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [INSUFFICIENT_BALANCE]
        '403':
          description: Forbidden - quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [RESERVED_IP_QUOTA_EXCEEDED]
                    description: Daily or total reserved IP quota exceeded
        '404':
          description: Not found - IP address not found, VM not active, or IP already reserved
  /network/reserved_ips/{reserved_ip_id}:
    get:
      summary: Get a specific reserved IP
      description: Retrieve details of a specific reserved IP by ID
      tags:
        - Reserved IPs
      security:
        - api_key: []
      parameters:
        - name: reserved_ip_id
          in: path
          description: Reserved IP ID
          required: true
          schema:
            type: string
            format: uuid
            example: d3c0dc7b-6ca4-4b35-8f3c-a00adc3993d5
        - name: team_id
          in: query
          description: Team ID to verify ownership. If not provided, uses the user's primary team
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserved IP details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedIP'
        '401':
          description: Unauthorized - user doesn't have read permission for the team
        '404':
          description: Reserved IP not found or doesn't belong to the team
    delete:
      summary: Delete a reserved IP
      description: Terminate a reserved IP and release it back to the pool. Will automatically detach from VM if attached.
      tags:
        - Reserved IPs
      security:
        - api_key: []
      parameters:
        - name: reserved_ip_id
          in: path
          description: Reserved IP ID
          required: true
          schema:
            type: string
            format: uuid
            example: d3c0dc7b-6ca4-4b35-8f3c-a00adc3993d5
        - name: team_id
          in: query
          description: Team ID to verify ownership. If not provided, uses the user's primary team
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Reserved IP successfully deleted
        '401':
          description: Unauthorized - user doesn't have write permission for the team
        '403':
          description: Forbidden - cannot detach primary IP
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [UNABLE_TO_DETACH_PRIMARY_IP]
        '404':
          description: Reserved IP not found or already terminated

    patch:
      summary: Update reserved IP (rename or attach/detach VM)
      description: Update reserved IP properties - rename it or attach/detach it to/from a VM
      tags:
        - Reserved IPs
      security:
        - api_key: []
      parameters:
        - name: reserved_ip_id
          in: path
          description: Reserved IP ID
          required: true
          schema:
            type: string
            format: uuid
            example: d3c0dc7b-6ca4-4b35-8f3c-a00adc3993d5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: string
                  description: Team ID to verify ownership. If not provided, uses the user's primary team
                name:
                  type: string
                  maxLength: 64
                  description: New name for the reserved IP (set to empty string to use IP address as name)
                anchor_ip:
                  type: string
                  nullable: true
                  description: Anchor IP to route to. Use null to detach the current VM.
      responses:
        '200':
          description: Successfully updated
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      name:
                        type: string
                        description: Updated name (returned when renaming)
                  - type: object
                    properties:
                      attachment:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: UUID of the attached VM
                          name:
                            type: string
                            description: Name of the attached VM
                    description: Attachment details (returned when attaching)
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum:
                      - IP_NAME_TOO_LONG
                      - INVALID_LOCATION
                    description: Error code indicating validation failure
        '401':
          description: Unauthorized - user doesn't have write permission for the team
        '403':
          description: Forbidden - operation not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum:
                      - UNABLE_TO_DETACH_PRIMARY_IP
                      - RESERVED_IP_ALREADY_ATTACHED
                      - NO_ANCHOR_IP
                    description: Error code indicating why operation is forbidden
        '404':
          description: Reserved IP not found or not active

