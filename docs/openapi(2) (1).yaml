openapi: 3.0.3
info:
  title: Onidel Cloud API - OpenAPI 3.0
  description: |-
    Welcome to the **Onidel Cloud API** documentation. This API allows developers to seamlessly integrate with the Onidel Cloud platform, enabling them to manage cloud resources efficiently and securely. With our API, you can automate processes, retrieve detailed account information, and manage virtual machines (VPS), networking, storage, and more.
  termsOfService: https://docs.onidel.com/policies/terms-of-service
  contact:
    email: support@onidel.com
  version: 1.2.0
servers:
  - url: https://api.cloud.onidel.com
tags:
  - name: SSH Key
    description: Manage SSH keys for secure server access.
  - name: VPC
    description: Manage Virtual Private Cloud (VPC) networks for isolated networking.
  - name: Firewall
    description: Manage firewall groups for VM security.
  - name: OS Template
    description: We have a wide range of operating systems available to deploy server instances.
  - name: Instance Type
    description: We provide different instance types for different workload.
  - name: Startup Script
    description: Manage startup scripts that run on first boot of a server instance. Maximum 10 scripts per team.
  - name: IP List
    description: Manage IP lists for use in firewall rules. IP lists group multiple IP addresses/CIDRs together.
  - name: Firewall Rule
    description: Manage firewall rules within a firewall group.
  - name: Object Storage
    description: Manage S3-compatible object storage services, buckets, and access keys.
  - name: Custom ISO
    description: Manage custom ISO images that can be used to boot server instances (BYOI).
  - name: Measured Boot Image
    description: Manage SEV-SNP measured direct boot images (UKIs) and attach/detach them to instances.
paths:
  /teams:
    get:
      tags:
        - Teams
      summary: List Teams
      description: Retrieve all teams the user is a member of
      operationId: getTeams
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams'
      security:
        - api_key: []
  /ssh_keys:
    get:
      tags:
        - SSH Key
      summary: List SSH Keys
      description: Retrieve all SSH keys for a team
      operationId: getSSHKeys
      parameters:
        - name: team_id
          in: query
          description: Team ID to filter SSH keys. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKeys'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
        - api_key: []
    post:
      tags:
        - SSH Key
      summary: Create a new SSH Key
      description: Add a new SSH key to the team
      operationId: createSSHKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSSHKey'
      responses:
        '201':
          description: SSH key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKeyResponse'
        '400':
          description: Bad request - missing or invalid parameters
        '401':
          description: Unauthorized
      security:
        - api_key: []
  /ssh_keys/{ssh_key_id}:
    get:
      tags:
        - SSH Key
      summary: Get SSH Key by ID
      description: Retrieve a specific SSH key by its UUID
      operationId: getSSHKey
      parameters:
        - name: ssh_key_id
          in: path
          description: SSH Key UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID to filter SSH keys. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKeyResponse'
        '401':
          description: Unauthorized
        '404':
          description: SSH key not found
      security:
        - api_key: []
    patch:
      tags:
        - SSH Key
      summary: Update SSH Key
      description: Update an existing SSH key
      operationId: updateSSHKey
      parameters:
        - name: ssh_key_id
          in: path
          description: SSH Key UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSSHKey'
      responses:
        '204':
          description: SSH key updated successfully
        '400':
          description: Bad request - missing or invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: SSH key not found
      security:
        - api_key: []
    delete:
      tags:
        - SSH Key
      summary: Delete SSH Key
      description: Delete an SSH key
      operationId: deleteSSHKey
      parameters:
        - name: ssh_key_id
          in: path
          description: SSH Key UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: SSH key deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: SSH key not found
      security:
        - api_key: []
  /network/vpcs:
    get:
      tags:
        - VPC
      summary: List VPCs
      description: Retrieve all VPCs for a team
      operationId: getVPCs
      parameters:
        - name: team_id
          in: query
          description: Team ID to filter VPCs. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
        - name: location
          in: query
          description: Filter VPCs by location
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCs'
        '401':
          description: Unauthorized
      security:
        - api_key: []
    post:
      tags:
        - VPC
      summary: Create a new VPC
      description: Create a new Virtual Private Cloud network
      operationId: createVPC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVPC'
      responses:
        '201':
          description: VPC created successfully
        '400':
          description: Bad request - missing or invalid parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - minimum VM required or max VPC limit reached
        '404':
          description: Location not found
        '503':
          description: Service unavailable - resource not available
      security:
        - api_key: []
  /network/vpcs/{vpc_id}:
    get:
      tags:
        - VPC
      summary: Get VPC by ID
      description: Retrieve a specific VPC by its UUID
      operationId: getVPC
      parameters:
        - name: vpc_id
          in: path
          description: VPC UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCDetail'
        '401':
          description: Unauthorized
        '404':
          description: VPC not found
      security:
        - api_key: []
    patch:
      tags:
        - VPC
      summary: Update VPC
      description: Update an existing VPC's name, description, or shared teams
      operationId: updateVPC
      parameters:
        - name: vpc_id
          in: path
          description: VPC UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVPC'
      responses:
        '200':
          description: VPC updated successfully
        '400':
          description: Bad request - invalid name, description, or shared teams
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - shared VPC is attached to VMs
        '404':
          description: VPC not found
      security:
        - api_key: []
    delete:
      tags:
        - VPC
      summary: Delete VPC
      description: Delete a VPC (must not have any attached VMs)
      operationId: deleteVPC
      parameters:
        - name: vpc_id
          in: path
          description: VPC UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: VPC deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - VPC has attached VMs
        '404':
          description: VPC not found
      security:
        - api_key: []
  /network/firewalls:
    get:
      tags:
        - Firewall
      summary: List Firewall Groups
      description: Retrieve all firewall groups for a team
      operationId: getFirewalls
      parameters:
        - name: team_id
          in: query
          description: Team ID to filter firewall groups. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallGroups'
        '401':
          description: Unauthorized
      security:
        - api_key: []
    post:
      tags:
        - Firewall
      summary: Create Firewall Group
      description: Create a new firewall group
      operationId: createFirewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFirewallGroup'
      responses:
        '201':
          description: Firewall group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallGroupDetail'
        '400':
          description: Bad request - missing parameters or limit reached
        '401':
          description: Unauthorized
      security:
        - api_key: []
  /network/firewalls/{firewall_id}:
    get:
      tags:
        - Firewall
      summary: Get Firewall Group by ID
      description: Retrieve a specific firewall group by its UUID
      operationId: getFirewall
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallGroupDetail'
        '401':
          description: Unauthorized
        '404':
          description: Firewall group not found
      security:
        - api_key: []
    put:
      tags:
        - Firewall
      summary: Update Firewall Group
      description: Update a firewall group's description
      operationId: updateFirewall
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFirewallGroup'
      responses:
        '204':
          description: Firewall group updated successfully
        '401':
          description: Unauthorized
        '404':
          description: Firewall group not found
      security:
        - api_key: []
    delete:
      tags:
        - Firewall
      summary: Delete Firewall Group
      description: Delete a firewall group. Cannot delete if VMs are still attached.
      operationId: deleteFirewall
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Firewall group deleted successfully
        '400':
          description: Cannot delete - VMs still attached
        '401':
          description: Unauthorized
        '404':
          description: Firewall group not found
      security:
        - api_key: []

  /network/firewalls/{firewall_id}/rules:
    get:
      tags:
        - Firewall Rule
      summary: List Firewall Rules
      description: Retrieve all rules in a firewall group
      operationId: getFirewallRules
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallRules'
        '401':
          description: Unauthorized
        '404':
          description: Firewall group not found
      security:
        - api_key: []
    post:
      tags:
        - Firewall Rule
      summary: Create Firewall Rule
      description: |-
        Add a new rule to a firewall group.

        Special subnet values: `Cloudflare`, `Onidel`, `HetrixTools`, `CloudFront`, `UptimeRobot`.
        To reference an IP list, use `list:{ip_list_id}` as the subnet value.
      operationId: createFirewallRule
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFirewallRule'
      responses:
        '201':
          description: Firewall rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallRuleResponse'
        '400':
          description: Bad request - invalid parameters or duplicate rule
        '401':
          description: Unauthorized
        '404':
          description: Firewall group not found
      security:
        - api_key: []

  /network/firewalls/{firewall_id}/rules/{rule_id}:
    get:
      tags:
        - Firewall Rule
      summary: Get Firewall Rule by ID
      description: Retrieve a specific firewall rule
      operationId: getFirewallRule
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          description: Firewall Rule UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallRuleResponse'
        '401':
          description: Unauthorized
        '404':
          description: Rule not found
      security:
        - api_key: []
    patch:
      tags:
        - Firewall Rule
      summary: Update Firewall Rule
      description: Update a firewall rule's description (max 255 characters)
      operationId: updateFirewallRule
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          description: Firewall Rule UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: string
                  format: uuid
                desc:
                  type: string
                  maxLength: 255
                  example: "Allow HTTPS traffic"
              required:
                - desc
      responses:
        '200':
          description: Rule updated successfully
        '400':
          description: Bad request - description too long
        '401':
          description: Unauthorized
        '404':
          description: Rule not found
      security:
        - api_key: []
    delete:
      tags:
        - Firewall Rule
      summary: Delete Firewall Rule
      description: Delete a firewall rule from a group
      operationId: deleteFirewallRule
      parameters:
        - name: firewall_id
          in: path
          description: Firewall Group UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          description: Firewall Rule UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rule deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Rule not found
      security:
        - api_key: []

  /network/ip_lists:
    get:
      tags:
        - IP List
      summary: List IP Lists
      description: >-
        Retrieve all IP lists for a team. The response also includes the
        team's limits: ip_list_limit (maximum lists) and
        ip_list_entry_limit (maximum entries per list).
      operationId: getIPLists
      parameters:
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPLists'
        '401':
          description: Unauthorized
      security:
        - api_key: []
    post:
      tags:
        - IP List
      summary: Create IP List
      description: Create a new IP list. Limit per team is configurable.
      operationId: createIPList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIPList'
      responses:
        '201':
          description: IP list created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPListCreateResponse'
        '400':
          description: Bad request - missing parameters, duplicate name, or limit reached
        '401':
          description: Unauthorized
      security:
        - api_key: []

  /network/ip_lists/{ip_list_id}:
    get:
      tags:
        - IP List
      summary: Get IP List by ID
      description: Retrieve a specific IP list with all its entries
      operationId: getIPList
      parameters:
        - name: ip_list_id
          in: path
          description: IP List UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPListDetailResponse'
        '401':
          description: Unauthorized
        '404':
          description: IP list not found
      security:
        - api_key: []
    patch:
      tags:
        - IP List
      summary: Update IP List
      description: Update an IP list's name or description
      operationId: updateIPList
      parameters:
        - name: ip_list_id
          in: path
          description: IP List UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIPList'
      responses:
        '200':
          description: IP list updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPListCreateResponse'
        '400':
          description: Bad request - invalid parameters or duplicate name
        '401':
          description: Unauthorized
        '404':
          description: IP list not found
      security:
        - api_key: []
    delete:
      tags:
        - IP List
      summary: Delete IP List
      description: Delete an IP list. All firewall rules referencing this list will also be removed.
      operationId: deleteIPList
      parameters:
        - name: ip_list_id
          in: path
          description: IP List UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: IP list deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: IP list not found
      security:
        - api_key: []

  /network/ip_lists/{ip_list_id}/entries:
    post:
      tags:
        - IP List
      summary: Add Entry to IP List
      description: |-
        Add an IP address or CIDR to an IP list. Type is auto-detected if not provided.
        Supports IPv4 and IPv6 addresses and CIDR ranges. The `/0` prefix is not allowed.
      operationId: createIPListEntry
      parameters:
        - name: ip_list_id
          in: path
          description: IP List UUID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIPListEntry'
      responses:
        '201':
          description: Entry added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPListEntryResponse'
        '400':
          description: Bad request - invalid IP, duplicate entry, or entry limit reached
        '401':
          description: Unauthorized
        '404':
          description: IP list not found
      security:
        - api_key: []

  /network/ip_lists/{ip_list_id}/entries/{entry_id}:
    delete:
      tags:
        - IP List
      summary: Delete Entry from IP List
      description: Remove an entry from an IP list
      operationId: deleteIPListEntry
      parameters:
        - name: ip_list_id
          in: path
          description: IP List UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: entry_id
          in: path
          description: Entry UUID
          required: true
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          description: Team ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Entry deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Entry or IP list not found
      security:
        - api_key: []

  /os_templates:
    get:
      tags:
        - OS Template
      summary: List OS Templates
      description: List prebuilt OS images available for installation.
      operationId: getOSTemplate
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OSTemplate'
      security:
        - api_key: []

  /instance_types:
    get:
      tags:
        - Instance Type
      summary: List Instance Types
      description: List instance types available for provision
      operationId: getInstanceType
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceType'
      security:
        - api_key: []
  /instance_price:
    get:
      tags:
        - Instance Price
      summary: Get VM Price
      description: Get VM price based on the specified VM configuration parameters.
      operationId: getInstancePrice
      parameters:
        - name: vcpu
          in: query
          description: Number of virtual CPUs (vCPU)
          required: true
          explode: true
          schema:
            type: string
            format: int
        - name: ram
          in: query
          description: Amount of RAM (in MB)
          required: true
          explode: true
          schema:
            type: string
            format: int
        - name: disk
          in: query
          description: Disk size (in GB)
          required: true
          explode: true
          schema:
            type: string
            format: int
        - name: location
          in: query
          description: Deployment location
          required: true
          explode: true
          schema:
            type: string
            format: string
        - name: currency
          in: query
          description: Currency used to retrieve the price
          required: false
          explode: true
          schema:
            type: string
            enum:
              - aud
              - usd
              - eur
            default: usd
        - name: instance_type
          in: query
          description: Instance type identifier (UUID)
          required: true
          explode: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMPrice'
        '400':
          description: Bad request
        '404':
          description: Not found

  /measured-boot-images:
    get:
      tags:
        - Measured Boot Image
      summary: List measured boot images
      description: List the team's measured direct boot images (UKIs).
      operationId: getMeasuredBootImages
      security:
        - api_key: []
      parameters:
        - name: team_id
          in: query
          description: Team ID. Default team will be used if not provided.
          required: false
          explode: true
          schema:
